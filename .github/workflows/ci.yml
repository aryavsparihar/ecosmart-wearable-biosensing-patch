name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  firmware:
    name: Firmware build + native tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
      - name: Install PlatformIO
        run: pip install platformio==6.2.0
      - name: Build Arduino Nano firmware (sensors, simulation, Wokwi)
        run: pio run -e nanoatmega328 -e nanoatmega328_sim -e wokwi | tee build.log
      - name: Memory report
        run: |
          {
            echo "### Arduino Nano memory usage"
            echo '```'
            grep -E "Environment|RAM:|Flash:" build.log || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Native unit tests (Unity)
        run: pio test -e native
      - uses: actions/upload-artifact@v4
        with:
          name: firmware-hex
          path: .pio/build/*/firmware.hex

  ml:
    name: ML pipeline + parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: ml/requirements.txt
      - name: Install dependencies
        run: pip install -r ml/requirements.txt
      - name: Unit tests (pytest)
        run: pytest -q
      - name: Regenerate synthetic data and retrain
        run: |
          python ml/generate_data.py
          python ml/train.py | tee train.log
      - name: Exported model is reproducible
        run: |
          git diff --exit-code -- include/model_weights.h ml/model/model.json
          python ml/export_parity_vectors.py --check
      - name: Training summary
        run: |
          { echo "### Training (synthetic data)"; echo '```'; cat train.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
