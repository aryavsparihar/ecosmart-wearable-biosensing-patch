name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  firmware:
    name: Firmware build + native tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: actions/cache@v6
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
      - name: Install PlatformIO
        run: pip install platformio==6.2.0
      - name: Build Arduino Nano firmware (sensors, simulation, Wokwi)
        run: pio run -e nanoatmega328 -e nanoatmega328_sim -e wokwi | tee build.log
      - name: Memory report
        run: |
          {
            echo "### Arduino Nano memory usage"
            echo '```'
            grep -E "Environment|RAM:|Flash:" build.log || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Native unit tests (Unity)
        run: pio test -e native
      - uses: actions/upload-artifact@v7
        with:
          name: firmware-hex
          path: .pio/build/*/firmware.hex

  ml:
    name: ML pipeline + parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: ml/requirements.txt
      - name: Install dependencies
        run: pip install -r ml/requirements.txt
      - name: Unit tests (pytest)
        run: pytest -q
      - name: Regenerate synthetic data and retrain
        run: |
          python ml/generate_data.py
          python ml/train.py | tee train.log
      - name: Exported model is reproducible
        run: |
          git diff --exit-code -- include/model_weights.h ml/model/model.json
          python ml/export_parity_vectors.py --check
      - name: Training summary
        run: |
          { echo "### Training (synthetic data)"; echo '```'; cat train.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

  arduino-ide:
    name: Arduino IDE sketch (arduino-cli)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: arduino/setup-arduino-cli@v2
      - name: Install AVR core and OneWire
        run: |
          arduino-cli core update-index
          arduino-cli core install arduino:avr
          arduino-cli lib install OneWire
      - name: Compile exported sketch (sensors)
        run: |
          python tools/make_arduino_sketch.py
          arduino-cli compile --fqbn arduino:avr:nano build/arduino/ecosmart_patch
      - name: Compile exported sketch (SIMULATION_MODE)
        run: |
          python tools/make_arduino_sketch.py --simulation
          arduino-cli compile --fqbn arduino:avr:nano build/arduino/ecosmart_patch

  avr-smoke:
    name: Run firmware on simavr
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: actions/cache@v6
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
      - name: Install PlatformIO and simavr
        run: |
          pip install platformio==6.2.0
          sudo apt-get update && sudo apt-get install -y simavr
      - name: Build time-compressed simulation firmware
        run: pio run -e simavr
      - name: Execute on emulated ATmega328P
        run: |
          timeout 90 simavr -m atmega328p -f 16000000 .pio/build/simavr/firmware.elf \
            > simavr.log 2>&1 || true
          sed -e 's/\x1b\[[0-9;]*m//g' -e 's/\.\.$//' simavr.log > serial.log
          head -n 20 serial.log
          grep -m1 "free_ram_bytes" serial.log
          grep -q "personal baseline calibrated" serial.log
          grep -q "ALERT - possible irregularity" serial.log
          grep -q "alert cleared" serial.log
          echo "Firmware calibrated, raised and cleared an alert on the emulated Nano."
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: simavr-serial-log
          path: serial.log
