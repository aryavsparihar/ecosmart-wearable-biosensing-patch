; Eco-Smart Wearable Biosensing Patch - PlatformIO project configuration
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = nanoatmega328

; Arduino Nano (ATmega328P, 16 MHz, 2 KB SRAM, 32 KB flash).
; Boards with the newer Optiboot bootloader: add `upload_speed = 115200`
; or use `board = nanoatmega328new`.
[env:nanoatmega328]
platform = atmelavr@5.3.0
board = nanoatmega328
framework = arduino
monitor_speed = 115200
build_src_flags = -Wall -Wextra
lib_deps =
    paulstoffregen/OneWire@^2.3.8

; Same firmware, but sensor reads are replaced by the on-device synthetic
; signal generator: a self-running demo with nothing wired up.
;   pio run -e nanoatmega328_sim -t upload && pio device monitor
[env:nanoatmega328_sim]
extends = env:nanoatmega328
build_flags = -DSIMULATION_MODE

; Firmware for the Wokwi simulator (diagram.json): real sensor code, with the
; two potentiometers standing in for the pH and electrode signals. Time is
; compressed 4x (250 ms per sample) so calibration finishes in ~22 s.
[env:wokwi]
extends = env:nanoatmega328
build_flags = -DSAMPLE_PERIOD_MS=250UL

; SIMULATION_MODE firmware with time compressed 50x (20 ms per sample) so the
; CI smoke test can run the real AVR binary on the simavr emulator and see a
; full calibration + anomaly episode within seconds.
[env:simavr]
extends = env:nanoatmega328
build_flags = -DSIMULATION_MODE -DSAMPLE_PERIOD_MS=20UL

; Host build of the hardware-independent core (ring buffer, features,
; baseline, classifier, alert logic, simulator) for Unity unit tests:
;   pio test -e native
; Hardware drivers in src/hal/ and the Arduino entry point are excluded.
[env:native]
platform = native
test_framework = unity
test_build_src = yes
build_src_filter = +<*> -<main.cpp> -<hal/>
build_flags = -std=gnu++11 -Wall -Wextra
