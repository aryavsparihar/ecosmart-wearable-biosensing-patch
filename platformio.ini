; Eco-Smart Wearable Biosensing Patch - PlatformIO project configuration
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = nanoatmega328

; Arduino Nano (ATmega328P, 16 MHz, 2 KB SRAM, 32 KB flash).
; Boards with the newer Optiboot bootloader: add `upload_speed = 115200`
; or use `board = nanoatmega328new`.
[env:nanoatmega328]
platform = atmelavr@5.3.0
board = nanoatmega328
framework = arduino
monitor_speed = 115200
build_src_flags = -Wall -Wextra
