; Eco-Smart Wearable Biosensing Patch - PlatformIO project configuration
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = nanoatmega328

; Arduino Nano (ATmega328P, 16 MHz, 2 KB SRAM, 32 KB flash).
; Boards with the newer Optiboot bootloader: add `upload_speed = 115200`
; or use `board = nanoatmega328new`.
[env:nanoatmega328]
platform = atmelavr@5.3.0
board = nanoatmega328
framework = arduino
monitor_speed = 115200
build_src_flags = -Wall -Wextra

; Host build of the hardware-independent core (ring buffer, features,
; baseline, classifier, alert logic, simulator) for Unity unit tests:
;   pio test -e native
; Hardware drivers in src/hal/ and the Arduino entry point are excluded.
[env:native]
platform = native
test_framework = unity
test_build_src = yes
build_src_filter = +<*> -<main.cpp> -<hal/>
build_flags = -std=gnu++11 -Wall -Wextra
